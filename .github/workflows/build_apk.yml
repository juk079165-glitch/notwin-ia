name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        flutter create . --org com.notwin.ia --project-name notwin_ia --platforms=android
        mkdir -p lib
        echo "Placeholder" > lib/main.dart

    - name: Overwrite main.dart
      run: |
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';

        void main() => runApp(const NotwinIAApp());

        class NotwinIAApp extends StatelessWidget {
          const NotwinIAApp({super.key});
          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              theme: ThemeData(brightness: Brightness.dark),
              home: const Scaffold(body: Center(child: Text("notwin iA"))),
            );
          }
        }
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: notwin-ia-apk
        path: build/app/outputs/flutter-apk/app-release.apk
